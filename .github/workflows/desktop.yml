# 桌面版（Windows）：打出免安装 exe 和安装包，附带单文件网页版。
# 私有仓库的 Windows 构建按 2 倍计时，所以只在这些时候打包：
#   - 推送到 main
#   - 推送 v 开头的标签（比如 v0.2.0），会顺便建一个「草稿版本」，确认后手动发布
#   - 在 Actions 页面手动点「Run workflow」
#   - 其它分支的提交说明里带「[打包]」
name: 桌面版（Windows）

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  windows:
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[打包]')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - run: npm run build:single

      # 发布附件的文件名只能用英文，中文会被 GitHub 改掉
      - name: 整理文件
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/st-beautify-studio.exe out/st-beautify-studio-portable.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item dist-single/index.html out/st-beautify-studio-web.html
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/*
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: out/*
