# 网页版：每次推送都检查能不能构建，并产出「单文件网页版」；
# 只有 main 分支、并且仓库已开启 GitHub Pages（来源选 GitHub Actions）时才发布到网页。
name: 网页版

on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:single
      - name: 单文件网页版
        uses: actions/upload-artifact@v7
        with:
          name: web-single-file
          path: dist-single/index.html

      - name: 检查网页版是否已开启
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null) || t=""
          if [ "$t" = "workflow" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::网页版（GitHub Pages）还没开启，或来源不是 GitHub Actions，这次只构建、不发布"
          fi
      - if: steps.pages.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
